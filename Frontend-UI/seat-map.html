<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Seats</title>
    <link rel="stylesheet" href="css/admin.css">
    <!-- Added Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base & Theme Styling */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .navbar a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .navbar a:hover {
            color: #ffffff;
        }

        /* Layout Containers */
        .seat-container { 
            max-width: 900px; 
            margin: 40px auto; 
            text-align: center; 
            padding: 0 20px;
        }

        .seat-container h2 {
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* 3D Glowing Screen */
        .screen { 
            background: linear-gradient(to bottom, #ffffff, #a3a3a3); 
            height: 60px; 
            width: 80%; 
            margin: 0 auto 50px auto; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 4px;
            transform: perspective(300px) rotateX(-5deg);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.15), 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Legend */
        .showcase {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            list-style: none;
            padding: 0;
        }

        .showcase li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .showcase .seat {
            width: 30px;
            height: 30px;
            cursor: default;
        }

        /* Seat Grid & Interactions */
        .seat-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 40px;
        }

        .seat { 
            width: 45px; 
            height: 50px; 
            border-radius: 12px 12px 4px 4px; /* Shaped like a chair */
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .seat.Available { 
            background-color: #3b4252; 
            color: #e5e9f0; 
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
        }
        
        .seat.Available:hover {
            transform: translateY(-4px) scale(1.05);
            background-color: #4c566a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3), inset 0 -3px 0 rgba(0,0,0,0.3);
        }

        .seat.Booked { 
            background-color: #2b2b2b; 
            color: #555; 
            cursor: not-allowed; 
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.5);
        }

        .seat.Selected { 
            background-color: #00d2ff; 
            color: #000; 
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6), inset 0 -3px 0 rgba(0, 160, 200, 1);
            transform: translateY(-2px);
        }

        /* Cart Panel (Glassmorphism) */
        .cart-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left; 
            max-width: 450px; 
            margin: 0 auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .cart-panel h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .cart-panel p {
            font-size: 1.1rem;
            margin: 15px 0;
            color: #e2e8f0;
        }

        .cart-panel span {
            font-weight: 600;
            color: #00d2ff;
        }

        .checkout-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer; 
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .checkout-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .checkout-btn:disabled { 
            background: #4a5568; 
            color: #a0aec0;
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }

        @media (max-width: 600px) {
            .screen { width: 100%; }
            .seat { width: 35px; height: 40px; font-size: 0.8rem; }
            .navbar { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>Event & Parking Reservations</h2>
        <div><a href="events.html">← Back to Events</a></div>
    </nav>
    
    <div class="seat-container">
        <h2>Choose Your Perfect Spot</h2>
        
        <div class="screen">STAGE / SCREEN</div>

        <!-- Optional Legend so users know what colors mean -->
        <ul class="showcase">
            <li><div class="seat Available"></div> Available</li>
            <li><div class="seat Selected"></div> Selected</li>
            <li><div class="seat Booked"></div> Occupied</li>
        </ul>

        <div id="seatGrid" class="seat-grid">
            <h3 style="color: #aaa; width: 100%;">Loading seats...</h3>
        </div>

        <div class="cart-panel">
            <h3>Your Selection</h3>
            <p>Seats: <span id="selectedSeatLabels">None</span></p>
            <p>Total: $<span id="totalPrice">0.00</span></p>
            <button id="checkoutBtn" class="checkout-btn" disabled onclick="submitBooking()">Checkout & Book</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/seat-map.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Event & Parking Reservation</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Master Design System Stylesheet -->
    <link rel="stylesheet" href="css/design-system.css">

    <style>
        .dashboard-layout {
            max-width: 1280px;
            margin: 40px auto 80px auto;
            padding: 0 20px;
        }

        .dashboard-welcome-banner {
            padding: 36px 40px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(9, 13, 22, 0.6);
            color: var(--text-secondary);
            padding: 16px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.92rem;
            color: var(--text-primary);
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <!-- STICKY GLASS TOP NAVIGATION -->
    <nav class="glass-navbar">
        <a href="events.html" class="brand-logo">
            <div class="brand-icon">
                <i class="fa-solid fa-ticket"></i>
            </div>
            EventTix
        </a>

        <div class="nav-menu">
            <a href="events.html" class="nav-link">
                <i class="fa-solid fa-compass"></i> Browse Events
            </a>
            <a href="customer-dashboard.html" class="nav-link active">
                <i class="fa-solid fa-id-card"></i> My Dashboard
            </a>
            <a href="notifications.html" class="nav-link">
                <i class="fa-regular fa-bell"></i> Notifications
            </a>
            <div class="user-pill">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <button onclick="logout()" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.82rem;">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- DASHBOARD CONTAINER -->
    <div class="dashboard-layout">
        
        <!-- Welcome Banner -->
        <div class="glass-panel dashboard-welcome-banner">
            <div>
                <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 6px;">Customer Portal</h1>
                <p style="color: var(--text-secondary); margin: 0;">Manage your event tickets, seat reservations, parking passes, and payment receipts.</p>
            </div>
            <a href="events.html" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Book New Event
            </a>
        </div>

        <!-- Bookings Section -->
        <div class="glass-panel" style="padding: 28px; margin-bottom: 32px;">
            <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-calendar-check" style="color: var(--primary);"></i> My Ticket & Parking Bookings
            </h2>
            
            <div id="bookingsContainer" class="table-responsive">
                <div style="padding: 40px; text-align: center; color: var(--text-secondary);">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary); margin-bottom: 12px;"></i>
                    <p>Fetching active reservations...</p>
                </div>
            </div>
        </div>

        <!-- Payments Section -->
        <div class="glass-panel" style="padding: 28px;">
            <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-file-invoice-dollar" style="color: var(--accent-emerald);"></i> Payment History & Digital Receipts
            </h2>
            
            <div id="paymentsContainer" class="table-responsive">
                <div style="padding: 40px; text-align: center; color: var(--text-secondary);">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--accent-emerald); margin-bottom: 12px;"></i>
                    <p>Fetching payment receipts...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Core Logic & API Integration -->
    <script src="js/api.js"></script>
    <script src="js/customer-dashboard.js"></script>
</body>
</html>

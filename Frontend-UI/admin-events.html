<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Events</title>
    
    <!-- Modern Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    
    <style>
        /* Global Styles & Variables */
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --dark: #1e293b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
        }

        /* Navigation Bar (Matches Dashboard) */
        .navbar {
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover {
            color: white;
        }

        /* Container & Cards */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 30px;
        }

        .card-header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark);
        }

        .card-header h2, .card-header h3 {
            margin: 0;
            font-size: 1.5rem;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-grid input, .form-grid select {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .form-grid input:focus, .form-grid select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Buttons */
        .btn-primary {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }

        th {
            background: #f8fafc;
            padding: 16px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <h2><i class="fa-solid fa-calendar-check"></i> EventAdmin</h2>
        <div>
                        <a href="admin-dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    
    <a href="admin-venues.html"><i class="fa-solid fa-map-location-dot"></i> Venues</a>
    <a href="admin-events.html"><i class="fa-solid fa-ticket"></i> Events</a>
    <a href="admin-customers.html"><i class="fa-solid fa-users"></i> Customers</a>
    <a href="admin-parking.html"><i class="fa-solid fa-square-parking"></i> Parking</a>
    <a href="admin-seats.html"><i class="fa-solid fa-chair"></i> Seats</a>
    <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        </div>
    </nav>
    
    <div class="container">
        
        <!-- Create Event Card -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-circle-plus" style="color: var(--primary);"></i>
                <h2>Create New Event</h2>
            </div>
            
            <div class="form-grid">
                <input type="text" id="eTitle" placeholder="Event Title (e.g. Summer Music Festival)" class="full-width">
                
                <select id="eVenue">
                    <option value="">-- Select Venue --</option>
                </select>
                
                <select id="eCategory">
                    <option value="">-- Select Category --</option>
                </select>
                
                <input type="datetime-local" id="eDate">
                <input type="number" id="eCapacity" placeholder="Capacity (Must not exceed venue)">
                
                <input type="number" step="0.01" id="eTicketPrice" placeholder="Ticket Price ($)">
                <input type="number" step="0.01" id="eParkingFee" placeholder="Parking Fee ($)">
                
                <button class="full-width btn-primary" onclick="addEvent()">
                    <i class="fa-solid fa-check"></i> Create Event
                </button>
            </div>
        </div>

        <!-- Existing Events Card -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-list" style="color: var(--text-muted);"></i>
                <h3>Existing Events</h3>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Capacity</th>
                            <th>Ticket Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="eventTable">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Loading events...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth/admin-events.js"></script>
</body>
</html>

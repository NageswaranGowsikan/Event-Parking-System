<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .payment-container { max-width: 600px; margin: 50px auto; text-align: center; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .timer-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 4px; font-size: 24px; font-weight: bold; margin: 20px 0; border: 1px solid #ffeeba;}
        .timer-expired { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        .btn-pay { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-pay:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body style="background: #f4f7f6;">
    <nav class="navbar"><h2>Event & Parking Reservations</h2></nav>
    
    <div class="payment-container">
        <h2>Complete Your Booking</h2>
        <p>Booking Reference: <strong id="bookingRef">Loading...</strong></p>
        
        <div id="timerBox" class="timer-box">
            Time Remaining: <span id="countdownDisplay">--:--</span>
        </div>

        <p>Your seats and parking are temporarily locked. If payment is not completed before the timer expires, they will be released to other customers.</p>
        
        <button id="payBtn" class="btn-pay" onclick="submitPayment()">Simulate Payment</button>
        
        <br><br>
        <button onclick="cancelBooking()" style="background: transparent; border: none; color: #dc3545; cursor: pointer; text-decoration: underline;">Cancel Booking</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>

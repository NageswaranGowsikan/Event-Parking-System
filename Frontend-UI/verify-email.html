<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Event & Parking Reservation</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Master Design System Stylesheet -->
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    
    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center;">
            <div class="auth-header">
                <a href="events.html" class="auth-brand-logo">
                    <div class="brand-icon">
                        <i class="fa-solid fa-envelope-circle-check"></i>
                    </div>
                    EventTix
                </a>
                <h1 class="auth-title">Email Verification</h1>
                <p class="auth-subtitle">Validating your email verification security token</p>
            </div>

            <!-- Dynamic Verification Status Message -->
            <div id="msg" class="message success" style="display: block;">
                <i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i> Verifying your token...
            </div>

            <div id="loginLink" style="display: none; margin-top: 24px;">
                <a href="login.html" class="btn btn-primary" style="width: 100%; padding: 14px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Proceed to Sign In
                </a>
            </div>

            <div class="auth-footer">
                Need help? <a href="login.html">Contact Support</a>
            </div>
        </div>
    </div>

    <!-- Core Logic & Auth Handler -->
    <script src="js/api.js"></script>
    <script src="js/auth/verify-email.js"></script>
</body>
</html>

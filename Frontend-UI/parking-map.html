<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Parking</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .container { max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; }
        #errorMsg { color: #dc3545; font-weight: bold; margin-bottom: 20px; display: none; }
        
        .parking-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 30px 0; }
        .slot { 
            width: 80px; height: 100px; border: 2px dashed #ccc; border-radius: 8px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            cursor: pointer; transition: 0.2s; background: #f8f9fa;
        }
        .slot:hover:not(.occupied) { border-color: #0056b3; background: #e9ecef; }
        
        /* BRD Rule: Prevent occupied slots from being selected */
        .slot.occupied { background: #dc3545; color: white; border-style: solid; border-color: #c82333; cursor: not-allowed; opacity: 0.7; }
        
        /* BRD Rule: Select at most one available slot */
        .slot.selected { background: #28a745; color: white; border-style: solid; border-color: #218838; transform: scale(1.05); }
        
        .slot-name { font-weight: bold; font-size: 18px; }
        .slot-fee { font-size: 12px; margin-top: 5px; }

        .summary-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; min-width: 300px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn-skip { background: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-confirm { background: #0056b3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-confirm:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body style="background: #f4f7f6;">
    
    <div class="container">
        <h2>Reserve a Parking Spot</h2>
        <p>Parking is optional. You may select a maximum of <strong>one</strong> spot for your vehicle.</p>
        
        <div id="errorMsg">Invalid booking session.</div>

        <!-- Visual Layout -->
        <div id="parkingLayout" class="parking-grid">
            <!-- Slots injected here by JS -->
        </div>

        <div class="summary-box">
            <h3>Parking Selection</h3>
            <p>Selected Spot: <strong id="selectedSpotText">None</strong></p>
            <p>Parking Fee: <strong id="selectedFeeText">$0.00</strong></p>
            
            <div class="btn-group">
                <!-- BRD Rule: Allow booking with no parking (optional) -->
                <button class="btn-skip" onclick="skipParking()">Skip Parking / Finish</button>
                <button class="btn-confirm" id="confirmBtn" onclick="addParking()" disabled>Add Parking & Finish</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/parking-map.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Event & Parking Reservation</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Master Design System Stylesheet -->
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 480px;">
            <div class="auth-header">
                <a href="events.html" class="auth-brand-logo">
                    <div class="brand-icon">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    EventTix
                </a>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join today to reserve live tickets and dedicated parking spots</p>
            </div>

            <!-- Dynamic Alert Message -->
            <div id="msg" class="message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="form-input-wrapper">
                        <input type="text" id="name" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="form-input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="alex@example.com" required autocomplete="email">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <div class="form-input-wrapper">
                        <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 000-0000" required autocomplete="tel">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="form-input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="At least 8 characters" required autocomplete="new-password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In instead</a>
            </div>
        </div>
    </div>

    <!-- Core Logic & Auth Handler -->
    <script src="js/api.js"></script>
    <script src="js/auth/register.js"></script>
</body>
</html>

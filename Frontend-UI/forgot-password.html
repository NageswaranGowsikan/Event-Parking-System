<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Event & Parking Reservation</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Master Design System Stylesheet -->
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="events.html" class="auth-brand-logo">
                    <div class="brand-icon">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    EventTix
                </a>
                <h1 class="auth-title">Reset Your Password</h1>
                <p class="auth-subtitle">Enter your registered email address and we'll send you a password reset link.</p>
            </div>

            <!-- Dynamic Alert Message -->
            <div id="msg" class="message"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="form-input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Back to Sign In</a>
            </div>
        </div>
    </div>

    <!-- Core Logic & Auth Handler -->
    <script src="js/api.js"></script>
    <script src="js/auth/forgot-password.js"></script>
</body>
</html>

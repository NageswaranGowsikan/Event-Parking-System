<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <!-- Modern Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    
    <style>
        /* Global Styles */
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #06b6d4;
            --dark: #1e293b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
        }

        /* Navigation Bar */
        .navbar {
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-logout {
            background: transparent;
            color: #f87171;
            border: 1px solid #f87171;
            padding: 7px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 15px;
        }

        .btn-logout:hover {
            background: #f87171;
            color: white;
        }

        /* Dashboard Container */
        .dashboard-container {
            max-width: 1280px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h2 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            color: var(--dark);
        }

        .dashboard-header p {
            margin: 0;
            color: var(--text-muted);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }
        
        .metric-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border-top: 4px solid var(--primary);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .metric-card h3 {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .metric-card i {
            font-size: 1.5rem;
            color: var(--primary);
            opacity: 0.8;
        }

        .metric-card p {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark);
        }

        /* Specific Card Colors */
        .card-revenue { border-top-color: var(--success); }
        .card-revenue i { color: var(--success); }
        .card-revenue p { color: var(--success); }

        .card-parking { border-top-color: var(--warning); }
        .card-parking i { color: var(--warning); }

        .card-seats { border-top-color: var(--info); }
        .card-seats i { color: var(--info); }

        .card-customers { border-top-color: #8b5cf6; }
        .card-customers i { color: #8b5cf6; }

        /* Loading Spinner */
        .loader-container {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 40px;
            justify-content: center;
            color: var(--text-muted);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 992px) {
            .navbar { flex-direction: column; gap: 15px; padding: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <h2 class="navbar-brand">
            <i class="fa-solid fa-calendar-check"></i> EventAdmin
        </h2>
        <div class="nav-links">
            <a href="admin-venues.html"><i class="fa-solid fa-map-location-dot"></i> Venues</a>
            <a href="admin-events.html"><i class="fa-solid fa-ticket"></i> Events</a>
            <a href="admin-customers.html"><i class="fa-solid fa-users"></i> Customers</a>
            <a href="admin-parking.html"><i class="fa-solid fa-square-parking"></i> Parking</a>
            <a href="admin-seats.html"><i class="fa-solid fa-chair"></i> Seats</a>
            <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        </div>
    </nav>
    
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>System Overview</h2>
            <p>Live metrics across all events and bookings</p>
        </div>
        
        <!-- Upgraded Loading Animation -->
        <div id="loadingMessage" class="loader-container">
            <div class="spinner"></div>
            <h3>Loading latest metrics...</h3>
        </div>

        <div class="metrics-grid" id="metricsGrid" style="display: none;">
            
            <div class="metric-card card-revenue">
                <div class="card-header">
                    <h3>Total Revenue</h3>
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
                <p>$<span id="metricRevenue">0.00</span></p>
            </div>
            
            <div class="metric-card">
                <div class="card-header">
                    <h3>Total Events</h3>
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <p id="metricEvents">0</p>
            </div>
            
            <div class="metric-card">
                <div class="card-header">
                    <h3>Total Bookings</h3>
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <p id="metricBookings">0</p>
            </div>
            
            <div class="metric-card card-seats">
                <div class="card-header">
                    <h3>Available Seats</h3>
                    <i class="fa-solid fa-couch"></i>
                </div>
                <p id="metricSeats">0</p>
            </div>
            
            <div class="metric-card card-parking">
                <div class="card-header">
                    <h3>Occupied Parking</h3>
                    <i class="fa-solid fa-car"></i>
                </div>
                <p id="metricParking">0</p>
            </div>
            
            <div class="metric-card card-customers">
                <div class="card-header">
                    <h3>Total Customers</h3>
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <p id="metricCustomers">0</p>
            </div>
            
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>

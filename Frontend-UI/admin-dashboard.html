<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .dashboard-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .metric-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #007bff; }
        .metric-card h3 { margin: 0; color: #6c757d; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;}
        .metric-card p { margin: 15px 0 0; font-size: 36px; font-weight: bold; color: #343a40; }
        
        /* Unique colors for specific cards */
        .card-revenue { border-top-color: #28a745; }
        .card-revenue p { color: #28a745; }
        .card-parking { border-top-color: #ffc107; }
        .card-seats { border-top-color: #17a2b8; }
    </style>
</head>
<body style="background: #f4f7f6;">
    <nav class="navbar">
        <h2>Event & Parking Admin</h2>
        <div>
            <button onclick="logout()" style="background: transparent; color: white; border: 1px solid white; padding: 5px 15px; cursor: pointer;">Logout</button>
        </div>
    </nav>
    
    <div class="dashboard-container">
        <h2>System Overview</h2>
        <p>Live metrics across all events and bookings.</p>
        
        <div id="loadingMessage"><h3>Loading metrics...</h3></div>

        <div class="metrics-grid" id="metricsGrid" style="display: none;">
            <div class="metric-card card-revenue">
                <h3>Total Revenue</h3>
                <p>$<span id="metricRevenue">0.00</span></p>
            </div>
            <div class="metric-card">
                <h3>Total Events</h3>
                <p id="metricEvents">0</p>
            </div>
            <div class="metric-card">
                <h3>Total Bookings</h3>
                <p id="metricBookings">0</p>
            </div>
            <div class="metric-card card-seats">
                <h3>Available Seats</h3>
                <p id="metricSeats">0</p>
            </div>
            <div class="metric-card card-parking">
                <h3>Occupied Parking</h3>
                <p id="metricParking">0</p>
            </div>
            <div class="metric-card">
                <h3>Total Customers</h3>
                <p id="metricCustomers">0</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
